networks:
  proxy_network:
    driver: bridge

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /tmp
      - /data
      - /config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy_network
    depends_on:
      - infodisplay
    restart: unless-stopped

  infodisplay:
    build: .
    expose:
      - "3000"
    environment:
      SMARTCITY_API_KEY: ${SMARTCITY_API_KEY:-}
      SMARTCITY_CLIENT_ID: ${SMARTCITY_CLIENT_ID:-}
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy_network
    restart: unless-stopped
